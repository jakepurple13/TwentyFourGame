name: Android Release Workflow

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

  workflow_dispatch:
#    inputs:
#      releaseToGooglePlay:
#        description: 'Release to Google Play?'
#        required: true
#        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    name: Generate AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - run: |
          echo $GOOGLE_SERVICES_JSON > androidApp/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get tag name
        id: get_tag_name
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      #      - name: Bump version
      #        uses: chkfung/android-version-actions@v1.1
      #        with:
      #          gradlePath: androidApp/build.gradle.kts
      #          versionCode: ${{github.run_number}}
      #          versionName: ${{ env.VERSION_TAG }}

      # The Gradle Managed Device emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate Baseline and Startup Profiles
        run: >
          ./gradlew :androidApp:generateBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true
          --no-configuration-cache
          --stacktrace

      - name: Upload Generated Profiles
        uses: actions/upload-artifact@v4
        with:
          name: Baseline Profiles
          path: androidApp/src/main/generated/baselineProfiles/

      - name: Build Artifacts
        id: buildApks
        run: ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease

      - uses: kevin-david/zipalign-sign-android-release@v2.0.1
        name: Sign app APK
        id: twentyfourgame_sign
        with:
          releaseDirectory: androidApp/build/outputs/bundle/release/
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - uses: kevin-david/zipalign-sign-android-release@v2.0.1
        name: Sign app APK2
        id: twentyfourgame_apk_sign
        with:
          releaseDirectory: androidApp/build/outputs/apk/release/
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "33.0.0"

      - name: Clean up build artifacts
        run: |
          cp ${{ steps.twentyfourgame_sign.outputs.signedReleaseFile }} twentyfourgame-release.aab
          cp ${{ steps.twentyfourgame_apk_sign.outputs.signedReleaseFile }} twentyfourgame-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Signed TwentyFourGame App
          path: twentyfourgame-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Signed TwentyFourGame Apk
          path: twentyfourgame-release.apk

